# One conda environment for the whole Population Genomics module:
# rendering the Quarto decks, running the msprime exercises, and (optionally)
# executing the in-deck R demos.
#
#   conda env create -f environment.yml      # create
#   conda activate plantevo-popgen           # use
#   conda env update -f environment.yml --prune   # update after edits
#
name: plantevo-popgen

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.11

  # --- population-genetic simulation & analysis ---
  - msprime>=1.3        # coalescent simulator (all three exercises)
  - tskit>=0.5          # tree-sequence toolkit (diversity, SFS, Fst, Tajima's D)
  - demes>=0.2          # readable demographic-model descriptions (optional, handy)
  - numpy>=1.26
  - scipy
  - pandas

  # --- plotting ---
  - matplotlib>=3.8
  - seaborn

  # --- notebooks + Quarto Python execution ---
  - jupyter
  - jupyterlab
  - ipykernel
  - nbclient
  - nbformat
  - jupyter-cache       # Quarto caches executable chunks here

  # --- Quarto CLI ---
  # Optional: only if you want Quarto pinned inside the env. You already have a
  # system Quarto (1.6.x); delete this line to use that instead.
  - quarto>=1.5

  # --- OPTIONAL: execute the R code blocks in the decks (Wright–Fisher, TajimaD) ---
  # These demos are display-only by default; uncomment to run them live (base R only).
  # - r-base>=4.3
  # - r-irkernel
